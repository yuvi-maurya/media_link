<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="A personal link-in-bio page with links to social profiles."
    >
    <meta name="theme-color" content="#08111f">

    <title>Personal Links | Link in Bio</title>

    <!-- Google Font: the system-font fallback keeps the page usable offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="page-shell">
      <article class="profile-card" aria-labelledby="profile-name">
        <button
          class="theme-toggle"
          type="button"
          aria-label="Light theme"
          aria-pressed="false"
          title="Switch to light mode"
        >
          <svg
            class="theme-icon theme-icon--sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"
            ></path>
          </svg>

          <svg
            class="theme-icon theme-icon--moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
          </svg>
        </button>

        <header class="profile-header">
          <div class="avatar-frame">
            <!-- EDIT HERE: Replace the avatar src and describe your photo in the alt text. -->
            <img
              class="avatar"
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='200' height='200' fill='url(%23g)'/%3E%3Ccircle cx='100' cy='76' r='35' fill='%23fff' fill-opacity='.92'/%3E%3Cpath d='M36 190c4-45 29-69 64-69s60 24 64 69' fill='%23fff' fill-opacity='.92'/%3E%3C/svg%3E"
              alt="Profile photo placeholder"
              width="200"
              height="200"
            >
          </div>

          <p class="profile-kicker">Let&rsquo;s connect</p>

          <!-- EDIT HERE: Replace the name below with your name. -->
          <h1 id="profile-name">Your Name</h1>

          <!-- EDIT HERE: Replace the text below with your bio or tagline. -->
          <p class="profile-bio">Your tagline here</p>
        </header>

          <ul class="social-list" role="list">

                href="#"
                target="_blank"
                rel="noopener noreferrer"
              >

            </li>

                rel="noopener noreferrer"

                <span class="icon-shell" aria-hidden="true">

          </p>
        </footer>
